<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155e5c">
  <meta name="description" content="Reserve online e retire hoje nas lojas do Capim Dourado Shopping.">
  <title>Capim Dourado · Zaptos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div class="app" id="app">
    <header class="topbar">
      <button class="topbar__voltar" id="btn-voltar" type="button" aria-label="Voltar" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <svg class="topbar__logo" id="logo" viewBox="0 0 32 32" aria-hidden="true" hidden>
        <circle cx="16" cy="16" r="15" fill="#c9a24a"/>
        <path d="M16 16a2 2 0 1 1 2 2 4 4 0 1 1 2-6.5A6 6 0 1 1 11 9" fill="none" stroke="#0e3d3c" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div class="topbar__textos">
        <h1 id="titulo">Capim Dourado</h1>
        <p id="subtitulo"></p>
      </div>
    </header>

    <p class="aviso-modo" id="aviso-modo" role="status" hidden></p>

    <main id="conteudo" tabindex="-1" aria-live="polite">
      <p class="carregando">Carregando…</p>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
      <a href="#/" data-aba="inicio">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Início
      </a>
      <a href="#/buscar" data-aba="buscar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Buscar
      </a>
      <a href="#/pedidos" data-aba="pedidos">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        Pedidos
      </a>
      <a href="#/ajuda" data-aba="ajuda">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7v.5"/><path d="M12 17h.01"/></svg>
        Ajuda
      </a>
      <a href="#/perfil" data-aba="perfil">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Perfil
      </a>
    </nav>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/api-remota.js" defer></script>
  <script src="js/leitor-qr.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
