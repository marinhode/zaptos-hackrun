<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e3d3c">
  <meta name="robots" content="noindex">
  <title>Administração · Capim Dourado</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm">
  <a class="pular" href="#adm-conteudo">Pular para o conteúdo</a>

  <header class="adm-topo">
    <div class="adm-topo__marca">
      <svg viewBox="0 0 32 32" aria-hidden="true" width="32" height="32">
        <circle cx="16" cy="16" r="15" fill="#c9a24a"/>
        <path d="M16 16a2 2 0 1 1 2 2 4 4 0 1 1 2-6.5A6 6 0 1 1 11 9" fill="none" stroke="#0e3d3c" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <div>
        <strong>Capim Dourado</strong>
        <span>Administração do shopping</span>
      </div>
    </div>
    <div class="adm-topo__conta">
      <p class="adm-topo__usuario" id="adm-usuario"></p>
      <button type="button" class="adm-sair" id="adm-sair" hidden>Sair</button>
    </div>
  </header>

  <nav class="adm-abas" id="adm-abas" role="tablist" aria-label="Seções do painel" hidden>
    <button role="tab" type="button" data-aba="resumo" id="aba-resumo" aria-controls="adm-conteudo">Resumo</button>
    <button role="tab" type="button" data-aba="usuarios" id="aba-usuarios" aria-controls="adm-conteudo">Usuários</button>
    <button role="tab" type="button" data-aba="lojas" id="aba-lojas" aria-controls="adm-conteudo">Lojas</button>
    <button role="tab" type="button" data-aba="categorias" id="aba-categorias" aria-controls="adm-conteudo">Categorias</button>
    <button role="tab" type="button" data-aba="registro" id="aba-registro" aria-controls="adm-conteudo">Registro</button>
  </nav>

  <p class="adm-aviso" id="adm-aviso" role="status" aria-live="polite" hidden></p>

  <main class="adm-conteudo" id="adm-conteudo" role="tabpanel" tabindex="-1">
    <p class="adm-carregando">Carregando…</p>
  </main>

  <!-- Confirmação dentro da página (bloquear usuário ou loja) -->
  <dialog class="adm-dialogo" id="dlg-confirmar" aria-labelledby="dlg-confirmar-titulo">
    <form method="dialog">
      <h2 id="dlg-confirmar-titulo">Confirmar</h2>
      <p id="dlg-confirmar-texto"></p>
      <div class="adm-dialogo__acoes">
        <button class="btn btn--pequeno btn--contorno" value="nao" type="submit">Voltar</button>
        <button class="btn btn--pequeno btn--destaque" value="sim" type="submit" id="dlg-confirmar-sim">Confirmar</button>
      </div>
    </form>
  </dialog>

  <!-- Edição de loja -->
  <dialog class="adm-dialogo adm-dialogo--largo" id="dlg-loja" aria-labelledby="dlg-loja-titulo">
    <form id="form-loja" novalidate>
      <h2 id="dlg-loja-titulo">Editar loja</h2>
      <div class="adm-form">
        <label>Nome
          <input name="nome" required maxlength="120" autocomplete="off">
        </label>
        <label>Categoria
          <select name="categoriaId" required></select>
        </label>
        <label>Piso
          <input name="piso" required maxlength="20" placeholder="ex.: Piso 1" autocomplete="off">
        </label>
        <label>Localização
          <input name="localizacao" maxlength="120" placeholder="ex.: Loja 112" autocomplete="off">
        </label>
        <label>Horário de funcionamento
          <input name="horario" maxlength="120" placeholder="ex.: Seg a sáb 10h-22h" autocomplete="off">
        </label>
        <label>Telefone
          <input name="telefone" maxlength="20" inputmode="tel" autocomplete="off">
        </label>
      </div>
      <p class="adm-erro" id="form-loja-erro" role="alert" hidden></p>
      <div class="adm-dialogo__acoes">
        <button class="btn btn--pequeno btn--contorno" type="button" id="form-loja-cancelar">Cancelar</button>
        <button class="btn btn--pequeno btn--primario" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
